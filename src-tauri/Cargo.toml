[package]
name = "tico"
version = "0.1.0"
description = "A desktop pet that walks the bottom of your screen"
authors = ["fgrr12"]
edition = "2021"
default-run = "tico"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name, which
# is only an issue on Windows: rust-lang/cargo#8519
name = "tico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes the window actually transparent on macOS, and
# it is declared unconditionally rather than under a `cfg(target_os)` block on
# purpose: tauri-build validates it against `macOSPrivateApi` in tauri.conf.json
# on every target, and a target-scoped copy does not satisfy that check. It
# compiles to nothing off macOS. Note that apps using this API are rejected from
# the Mac App Store, which is not a target here.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }

tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via tao; declared directly so `macos.rs` can reach NSWindow
# to put the strip above the Dock. Tauri stops at alwaysOnTop.
objc2-app-kit = "0.3"
