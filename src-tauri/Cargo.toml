[package]
name = "tico"
version = "0.1.0"
description = "A desktop pet that walks the bottom of your screen"
authors = ["fgrr12"]
license = "MIT"
edition = "2021"
default-run = "tico"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name, which
# is only an issue on Windows: rust-lang/cargo#8519
name = "tico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes the window actually transparent on macOS, and
# it is declared unconditionally rather than under a `cfg(target_os)` block on
# purpose: tauri-build validates it against `macOSPrivateApi` in tauri.conf.json
# on every target, and a target-scoped copy does not satisfy that check. It
# compiles to nothing off macOS. Note that apps using this API are rejected from
# the Mac App Store, which is not a target here.
tauri = { version = "2", # `image-png` is what makes Image::from_bytes exist, for the monochrome
# menu bar icon.
features = ["macos-private-api", "tray-icon", "image-png"] }

tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Experiment: Ctrl+Shift+T to talk to him. Registered only when there is a key.
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Month arithmetic for recurring reminders. Rolling a date forward by hand is
# where the leap-year bug lives, and this is not the place to have one.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via tao; declared directly so `macos.rs` can reach NSWindow
# to put the strip above the Dock. Tauri stops at alwaysOnTop.
objc2-app-kit = "0.3"
# The Objective-C runtime itself, for the one thing that needs it: repointing the
# window at NSPanel so that clicking him does not activate the application.
objc2 = "0.6"
# Experiment: what is on the calendar, so he can dread a meeting before it starts.
# Only the store, events and their attendees; no reminders, maps or locations.
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "EKEventStore", "EKEvent", "EKCalendar", "EKCalendarItem", "EKParticipant", "EKTypes", "EKObject"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSArray", "NSError", "NSPredicate"] }
block2 = "0.6"
