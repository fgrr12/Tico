# Builds the installers on every platform and hangs them off a GitHub release.
#
# Separate from `build.yml` on purpose. That one asks "does it compile" on every
# push and is allowed to be strict and fast; this one only runs for a tag, builds
# in release mode, and has its own failure modes — bundling, asset names, the
# fact that nothing here is signed. A red tick should never be ambiguous about
# which of those two things broke.
#
# **It stops at a draft.** The last step is a person reading the page and
# pressing Publish, because the alternative is a mistyped tag becoming a release
# announcement. See the bottom of this file for what has to be said on it.

name: release

on:
  push:
    tags: ["v*"]
  # For rehearsing the whole thing against a tag that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: "24"

jobs:
  # One job creates the release, so three runners cannot race to create the same
  # one and end up with two. Everything after this attaches to its id.
  draft:
    name: draft
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      id: ${{ steps.make.outputs.id }}
      tag: ${{ steps.tag.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # The bundles are named from `tauri.conf.json`, not from the tag. Tag
      # v0.2.0 with 0.1.0 still in the config and the release page says one
      # version while every file on it says another — which is the kind of thing
      # nobody notices until somebody reports a bug against the wrong build.
      - name: the tag and the version agree
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${{ steps.tag.outputs.name }}"
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag but tauri.conf.json says $version"
            exit 1
          fi
          echo "$tag matches the configured version"

      - id: make
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.tag.outputs.name }}";

            // Re-running a tag should fill the same draft rather than pile up a
            // second one next to it.
            const { data: existing } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const already = existing.find((r) => r.tag_name === tag);
            if (already) {
              core.setOutput("id", already.id);
              return;
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `tico ${tag}`,
              draft: true,
              prerelease: false,
              body: [
                "## Install",
                "",
                "**Nothing here is signed**, and that is deliberate — notarisation is",
                "$99/year to remove one right-click. Each system will therefore complain,",
                "and here is what it means and how to get past it.",
                "",
                "### macOS",
                "",
                'Copy `tico.app` to `/Applications`, then run this once. Without it macOS says',
                '*"tico is damaged and can\'t be opened"*, which is its unhelpful phrasing for',
                '"unsigned" and alarms people who have done nothing wrong.',
                "",
                "```sh",
                "xattr -d com.apple.quarantine /Applications/tico.app",
                "```",
                "",
                "`aarch64` is Apple Silicon, `x64` is Intel.",
                "",
                "### Windows",
                "",
                'SmartScreen will say "unknown publisher". More info → Run anyway.',
                "",
                "### Linux",
                "",
                "`.deb` or `.AppImage`. He needs an X11 session or XWayland — see the",
                "platform table in the README for why GNOME Wayland is out.",
                "",
                "---",
                "",
                "He notices what you are doing only on macOS; everywhere else he walks,",
                "talks, sleeps and keeps his burrow, but not your desk.",
              ].join("\n"),
            });
            core.setOutput("id", release.id);

  bundle:
    name: bundle (${{ matrix.label }})
    needs: draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Macs are built on the Apple Silicon runner: cross-compiling to
          # Intel from there costs a target, where a second runner costs a queue.
          - os: macos-latest
            label: macOS Apple Silicon
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - os: macos-latest
            label: macOS Intel
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - os: windows-latest
            label: Windows
            args: ""
            rust-targets: ""
          - os: ubuntu-22.04
            label: Linux
            args: ""
            rust-targets: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.draft.outputs.tag }}

      - name: linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Its own key: this compiles in release, and sharing a cache with the debug
      # builds in `build.yml` would mean each one evicting the other's work.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.label }}

      - run: pnpm install --frozen-lockfile

      # Finds every bundle `tauri build` produced and attaches it to the draft.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }}
